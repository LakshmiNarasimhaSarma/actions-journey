name: Env-Demo
on: push
env:
  APP_NAME : Journey
jobs: 
 EnvDemo:
   runs-on: ubuntu-latest
   env:
     LOG_LEVEL: info
   steps:
     - name: App Name with Log level
       run: echo "$APP_NAME with $LOG_LEVEL"
     - name: App Name with Log Level as Debug
       env:
         LOG_LEVEL: debug
       run: echo "$APP_NAME with $LOG_LEVEL"
